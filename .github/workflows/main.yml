name: CI
on: [push, pull_request]
jobs:
  eslint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm ci
        timeout-minutes: 5
      - name: Run ESLint
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: supercharge/mongodb-github-action@1.3.0
        with:
          mongodb-version: 4.2
      - run: npm ci
        timeout-minutes: 5
      - name: Run tests
        run: npm test

  # Canary: the same tests on the next Node major (NODE-POLICY.md).
  # Non-blocking: a failure here is an early warning, not a release gate.
  test-node-current:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: current
      - uses: supercharge/mongodb-github-action@1.3.0
        with:
          mongodb-version: 4.2
      - run: npm ci
        timeout-minutes: 5
      - name: Run tests
        run: npm test
